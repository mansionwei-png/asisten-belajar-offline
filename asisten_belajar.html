<!-- Duplicate of index.html for asisten_belajar.html matching user screenshot -->
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asisten Belajar Offline</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="browser-window">
    <div class="browser-topbar">
      <div class="window-controls">
        <span class="control-dot dot-red"></span>
        <span class="control-dot dot-yellow"></span>
        <span class="control-dot dot-green"></span>
      </div>
      <div class="browser-address-bar">
        <span class="address-text">file:///C:/BahanP13/asisten_belajar.html</span>
      </div>
    </div>

    <div class="app-container">
      <aside class="sidebar">
        <div class="sidebar-header">
          <span>10 MODUL TERSEDIA</span>
        </div>
        <div class="modules-list" id="modules-list"></div>
      </aside>

      <div class="main-content">
        <div class="tabs-header">
          <button class="tab-btn active" id="tab-chatbot" data-tab="chatbot">
            <span class="tab-icon chat-icon">💭</span>
            <span class="tab-label">AI Chatbot</span>
          </button>
          <button class="tab-btn" id="tab-quiz" data-tab="quiz">
            <span class="tab-icon quiz-icon">?</span>
            <span class="tab-label">Generator Kuis</span>
          </button>
        </div>

        <div class="tab-pane active" id="pane-chatbot">
          <div class="chat-messages-container" id="chat-messages"></div>
          <div class="chat-input-area">
            <input 
              type="text" 
              id="chat-input" 
              class="chat-text-input" 
              placeholder="Apa itu renin dan apa bedanya dengan pepsin?"
              autocomplete="off"
            />
            <div class="chat-button-group">
              <button class="btn btn-teal" id="btn-kirim">Kirim</button>
              <button class="btn btn-teal" id="btn-rangkum">Rangkum</button>
            </div>
          </div>
        </div>

        <div class="tab-pane" id="pane-quiz">
          <div class="quiz-container" id="quiz-container"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="modulesData.js"></script>
  <script src="chatbot.js"></script>
  <script src="quiz.js"></script>
  <script src="app.js"></script>
</body>
</html>
